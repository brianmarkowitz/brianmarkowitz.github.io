<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Brian Markowitz portfolio focused on principle data architecture and intelligent data products.">
  <title>Brian Markowitz | Principle Data Architect</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231fb6ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07101b;
      --bg-soft: #0d1a2a;
      --panel: rgba(11, 21, 36, 0.9);
      --panel-strong: rgba(12, 25, 42, 0.96);
      --ink: #edf4ff;
      --muted: #9bb0cb;
      --stroke: rgba(159, 193, 237, 0.24);
      --accent: #1fb6ff;
      --accent-2: #39d98a;
      --accent-3: #ffbc5f;
      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
      --max: 1120px;
      --nav-height: 56px;
      --topbar-height: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Sora', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 5%, rgba(31, 182, 255, 0.18), transparent 28%),
        radial-gradient(circle at 84% 10%, rgba(57, 217, 138, 0.14), transparent 25%),
        linear-gradient(170deg, #07101b 0%, #0a1422 40%, #0f1828 100%);
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(128, 164, 206, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(128, 164, 206, 0.14) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at 50% 30%, #000 15%, transparent 72%);
    }

    .site {
      width: min(var(--max), 100% - 1.4rem);
      margin: 0 auto 2.6rem;
      overflow-x: clip;
    }

    #spotlight,
    #systems {
      scroll-margin-top: calc(var(--topbar-height) + 0.9rem);
    }

    .topbar-wrap {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: 0 0 0.48rem;
      padding-top: 0.24rem;
      padding-bottom: 0.28rem;
      background: #07101b;
      border-bottom: 1px solid rgba(159, 193, 237, 0.14);
    }

    .topbar {
      border: 1px solid rgba(159, 193, 237, 0.32);
      border-radius: 10px;
      background: linear-gradient(160deg, #0b192c, #0a1626);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      padding: 0.34rem 0.56rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.56rem;
      flex-wrap: nowrap;
      min-height: var(--nav-height);
    }

    .brand {
      font-size: 1.03rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .role {
      margin-top: 0.04rem;
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.6rem;
      color: var(--accent-2);
    }

    .topnav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.42rem;
      align-items: center;
    }

    .topnav-github {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(164, 194, 236, 0.36);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 170ms ease;
      text-decoration: none;
    }

    .topnav-github:hover {
      border-color: rgba(31, 182, 255, 0.78);
      background: rgba(31, 182, 255, 0.12);
      transform: translateY(-1px);
    }

    .topnav-github svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .panel {
      border: 1px solid var(--stroke);
      border-radius: var(--radius-xl);
      background: linear-gradient(165deg, rgba(12, 24, 40, 0.95), rgba(9, 17, 30, 0.95));
      box-shadow: var(--shadow);
    }

    .hero {
      padding: clamp(1rem, 2.4vw, 1.5rem);
      display: block;
      margin-bottom: 1rem;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent-2);
      margin-bottom: 0.5rem;
    }

    h1, h2, h3 {
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    h1 {
      font-size: clamp(1.7rem, 3.8vw, 2.8rem);
      max-width: 21ch;
      margin-bottom: 0.66rem;
    }

    .hero-lead {
      color: var(--muted);
      max-width: 62ch;
      font-size: 0.94rem;
    }

    .btn {
      text-decoration: none;
      border-radius: 999px;
      min-height: 40px;
      padding: 0.56rem 0.92rem;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.32rem;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--ink);
      transition: transform 170ms ease, box-shadow 170ms ease, border-color 170ms ease, background 170ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
    }

    .btn-primary {
      background: linear-gradient(120deg, #1fb6ff, #2f94ff);
      color: #03101f;
      border-color: rgba(119, 216, 255, 0.42);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(164, 194, 236, 0.38);
    }

    .btn-disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .section-head {
      margin: 1.06rem 0 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      font-size: clamp(1.32rem, 2.6vw, 1.95rem);
    }

    .section-head p {
      color: var(--muted);
      max-width: 62ch;
      font-size: 0.89rem;
    }

    .section-tight {
      margin-top: 0;
    }

    .carousel-shell {
      display: grid;
      grid-template-columns: 40px minmax(180px, 0.62fr) minmax(0, 1.34fr) minmax(180px, 0.62fr) 40px;
      gap: 0.56rem;
      align-items: stretch;
      width: 100%;
      min-width: 0;
    }

    .spotlight-card {
      border: 1px solid var(--stroke);
      border-radius: var(--radius-lg);
      background: linear-gradient(172deg, rgba(12, 24, 40, 0.96), rgba(9, 17, 30, 0.98));
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .spotlight-media {
      position: relative;
      aspect-ratio: 16 / 8.6;
      border-bottom: 1px solid var(--stroke);
      background: #030a14;
      overflow: hidden;
    }

    .spotlight-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.015);
      animation: breathe 12s ease-in-out infinite;
    }

    .spotlight-body {
      padding: 0.72rem;
      display: grid;
      gap: 0.42rem;
      align-content: start;
    }

    .spotlight-meta {
      display: flex;
      justify-content: space-between;
      gap: 0.46rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .spotlight-body h3 {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .spotlight-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.52rem;
    }

    .spotlight-title-row h3 {
      margin: 0;
      min-width: 0;
    }

    .spotlight-external {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(164, 194, 236, 0.34);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
      transition: 160ms ease;
    }

    .spotlight-external:hover {
      border-color: rgba(31, 182, 255, 0.82);
      background: rgba(31, 182, 255, 0.14);
      transform: translateY(-1px);
    }

    .spotlight-external svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .spotlight-body p {
      color: #cfddf1;
      font-size: 0.89rem;
      overflow-wrap: anywhere;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.42rem;
    }

    .insight {
      border: 1px solid rgba(164, 194, 236, 0.24);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      padding: 0.48rem;
      display: grid;
      gap: 0.2rem;
    }

    .insight.wide {
      grid-column: 1 / -1;
    }

    .insight-label {
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.61rem;
      color: var(--muted);
    }

    .insight p {
      margin: 0;
      font-size: 0.8rem;
      overflow-wrap: anywhere;
    }

    .spotlight-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.34rem;
    }

    .tag {
      border: 1px solid rgba(164, 194, 236, 0.28);
      border-radius: 999px;
      padding: 0.2rem 0.48rem;
      font-size: 0.67rem;
      color: #dce9fc;
      background: rgba(255, 255, 255, 0.02);
      overflow-wrap: anywhere;
    }

    .carousel-nav {
      border: 1px solid rgba(164, 194, 236, 0.34);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: 160ms ease;
      min-height: 100%;
    }

    .carousel-nav:hover {
      border-color: rgba(31, 182, 255, 0.84);
      background: rgba(31, 182, 255, 0.14);
    }

    .carousel-peek {
      border: 1px solid rgba(164, 194, 236, 0.24);
      border-radius: var(--radius-md);
      background: linear-gradient(160deg, rgba(10, 20, 34, 0.9), rgba(8, 16, 29, 0.9));
      padding: 0.5rem;
      display: grid;
      gap: 0.28rem;
      align-content: start;
      min-width: 0;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .carousel-peek:hover {
      border-color: rgba(31, 182, 255, 0.58);
      background: linear-gradient(160deg, rgba(11, 24, 42, 0.92), rgba(9, 18, 32, 0.92));
      transform: translateY(-1px);
    }

    .carousel-peek-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.42rem;
    }

    .carousel-peek-title-link {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(164, 194, 236, 0.34);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
      transition: 160ms ease;
    }

    .carousel-peek-title-link:hover {
      border-color: rgba(31, 182, 255, 0.82);
      background: rgba(31, 182, 255, 0.14);
      transform: translateY(-1px);
    }

    .carousel-peek-title-link svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .carousel-peek-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-2);
    }

    .carousel-peek-title {
      font-size: 0.98rem;
      line-height: 1.2;
    }

    .carousel-peek-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .carousel-peek-summary {
      font-size: 0.78rem;
      color: #c5d4ea;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .carousel-peek-actions {
      display: flex;
      justify-content: flex-end;
    }

    .carousel-footer {
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .carousel-counter {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .carousel-footer-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .mini-btn {
      text-decoration: none;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      border: 1px solid rgba(164, 194, 236, 0.36);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.02);
      min-height: 30px;
      padding: 0.34rem 0.58rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.71rem;
      font-weight: 600;
      cursor: pointer;
      transition: 160ms ease;
      text-align: center;
      white-space: nowrap;
    }

    .mini-btn:hover {
      border-color: rgba(31, 182, 255, 0.84);
      background: rgba(31, 182, 255, 0.12);
      transform: translateY(-1px);
    }

    .mini-btn.primary {
      border-color: rgba(57, 217, 138, 0.52);
      background: rgba(57, 217, 138, 0.14);
      color: #ddffe9;
    }

    .mini-btn.disabled {
      cursor: default;
      opacity: 0.48;
      pointer-events: none;
    }

    .footer {
      margin-top: 1rem;
      padding: 0.7rem 0.2rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 12, 0.72);
      backdrop-filter: blur(5px);
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 0.84rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 170ms ease;
      overflow-x: hidden;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(860px, calc(100vw - 1rem));
      max-height: min(90vh, 920px);
      overflow: auto;
      border: 1px solid var(--stroke);
      border-radius: var(--radius-lg);
      background: linear-gradient(165deg, rgba(10, 20, 35, 0.98), rgba(8, 16, 29, 0.98));
      box-shadow: 0 28px 56px rgba(0, 0, 0, 0.46);
      padding: 0.84rem;
      display: grid;
      gap: 0.72rem;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-kicker {
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(164, 194, 236, 0.42);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: 160ms ease;
    }

    .modal-close:hover {
      border-color: rgba(31, 182, 255, 0.8);
      background: rgba(31, 182, 255, 0.12);
    }

    .modal-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 0.7rem;
      align-items: start;
    }

    .modal-media {
      border: 1px solid rgba(164, 194, 236, 0.24);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #030914;
      aspect-ratio: 16 / 10;
    }

    .modal-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-body {
      display: grid;
      gap: 0.46rem;
      align-content: start;
    }

    .modal-meta {
      display: flex;
      justify-content: space-between;
      gap: 0.42rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-wrap: wrap;
    }

    .modal-body h3 {
      font-size: 1.34rem;
      line-height: 1.2;
    }

    .modal-body p {
      color: #c8d7ef;
      font-size: 0.86rem;
      overflow-wrap: anywhere;
    }

    .modal-grid {
      display: grid;
      gap: 0.4rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .modal-grid .insight {
      min-height: 100%;
    }

    .modal-grid .insight.wide {
      grid-column: 1 / -1;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.44rem;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 380ms ease, transform 380ms ease;
    }

    .reveal.on {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1.015); }
      50% { transform: scale(1.045); }
    }

    @media (max-width: 1240px) {
      .carousel-shell {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .carousel-nav {
        display: none;
      }

      .spotlight-card {
        grid-column: 1 / -1;
      }

      .carousel-peek {
        min-height: 0;
      }

      .spotlight-media {
        aspect-ratio: 16 / 9;
      }

      .spotlight-body {
        padding: 0.84rem;
        gap: 0.5rem;
      }

      .modal-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      :root {
        --nav-height: 52px;
      }

      .site {
        width: min(var(--max), 100% - 1rem);
      }

      .topbar-wrap {
        padding-top: 0.2rem;
        padding-bottom: 0.2rem;
      }

      .topbar {
        padding: 0.26rem 0.42rem;
        border-radius: 10px;
        min-height: var(--nav-height);
      }

      .topnav-github {
        width: 32px;
        height: 32px;
      }

      .hero {
        padding: 0.78rem;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.58rem;
      }

      .hero-lead {
        font-size: 0.86rem;
      }

      .section-head {
        margin-top: 0.82rem;
        margin-bottom: 0.52rem;
      }

      .section-head p {
        font-size: 0.8rem;
      }

      .carousel-shell {
        grid-template-columns: 1fr;
      }

      .carousel-peek {
        display: none;
      }

      .carousel-footer {
        margin-top: 0.36rem;
        align-items: stretch;
      }

      .carousel-counter {
        width: 100%;
      }

      .carousel-footer-actions {
        width: 100%;
      }

      .carousel-footer-actions .mini-btn {
        flex: 1 1 31%;
      }

      .spotlight-body {
        padding: 0.68rem;
      }

      .insight-grid {
        grid-template-columns: 1fr;
      }

      .insight.wide {
        grid-column: auto;
      }

      .modal {
        padding: 0.66rem;
      }

      .modal-body h3 {
        font-size: 1.12rem;
      }

      .modal-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .reveal,
      .btn,
      .mini-btn,
      .topnav-github,
      .carousel-nav,
      .carousel-peek,
      .modal-overlay,
      .spotlight-media img {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="site">
    <div class="topbar-wrap reveal">
      <header class="topbar">
        <div>
          <p class="brand">Brian Markowitz</p>
          <p class="role">Principle Data Architect</p>
        </div>
        <nav class="topnav" aria-label="Primary navigation">

    const impressivenessOrder = [8, 2, 4, 5, 11, 1, 12, 3, 7, 15, 6, 9, 10, 13, 14];
    const rankById = Object.fromEntries(impressivenessOrder.map((id, index) => [id, index + 1]));

    const projects = rawProjects
      .map((project) => ({
        ...project,
        rank: rankById[project.id] || Number.MAX_SAFE_INTEGER
      }))
      .sort((a, b) => a.rank - b.rank);

    const state = {
      activeProjectId: projects[0]?.id || null
    };

    let lastFocused = null;
    let resizeTimer = null;
    let topbarResizeObserver = null;

    function getProject(projectId) {
      return projects.find((project) => project.id === projectId) || projects[0];
    }

    function createMainAction(label, url, type = 'primary', emptyLabel = 'Not Public') {
      const className = type === 'secondary' ? 'btn btn-secondary' : 'btn btn-primary';
      if (!url) {
        return `<span class="${className} btn-disabled" aria-disabled="true">${emptyLabel}</span>`;
      }
      return `<a class="${className}" href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    }

    function getProjectIndex(projectId) {
      const index = projects.findIndex((project) => project.id === projectId);
      return index >= 0 ? index : 0;
    }

    function wrapProjectIndex(index) {
      const total = projects.length;
      return ((index % total) + total) % total;
    }

    function createPeekCard(project, positionLabel) {
      const externalIcon = project.demoUrl
        ? `
          <a class="carousel-peek-title-link" href="${project.demoUrl}" target="_blank" rel="noopener noreferrer" aria-label="Open ${project.title}">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M11.5 1a.5.5 0 0 0 0 1h1.793L8.146 7.146a.5.5 0 1 0 .708.708L14 2.707V4.5a.5.5 0 0 0 1 0v-3a.5.5 0 0 0-.5-.5h-3z"></path>
              <path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5V8a.5.5 0 0 0-1 0v4.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5H8a.5.5 0 0 0 0-1H3.5z"></path>
            </svg>
          </a>
        `
        : '';

      return `
        <p class="carousel-peek-kicker">${positionLabel}</p>
        <div class="carousel-peek-head">
          <h3 class="carousel-peek-title">${project.title}</h3>
          ${externalIcon}
        </div>
        <p class="carousel-peek-meta">${project.systemLabel} • ${project.year} • ${project.status}</p>
        <p class="carousel-peek-summary">${project.summary}</p>
        <div class="carousel-peek-actions">
          <button class="mini-btn js-peek-details" type="button" data-id="${project.id}">Details</button>
        </div>
      `;
    }

    function renderCarouselCards() {
      const total = projects.length;
      if (!total) return;

      const currentIndex = getProjectIndex(state.activeProjectId);
      const prevProject = projects[wrapProjectIndex(currentIndex - 1)];
      const nextProject = projects[wrapProjectIndex(currentIndex + 1)];

      const prevCard = document.getElementById('carousel-prev-card');
      const nextCard = document.getElementById('carousel-next-card');
      const counter = document.getElementById('carousel-counter');

      if (prevCard) {
        prevCard.innerHTML = createPeekCard(prevProject, 'Previous');
        prevCard.dataset.id = String(prevProject.id);
        prevCard.tabIndex = 0;
        prevCard.setAttribute('role', 'button');
      }

      if (nextCard) {
        nextCard.innerHTML = createPeekCard(nextProject, 'Next');
        nextCard.dataset.id = String(nextProject.id);
        nextCard.tabIndex = 0;
        nextCard.setAttribute('role', 'button');
      }

      if (counter) counter.textContent = `${currentIndex + 1} / ${total}`;

      document.querySelectorAll('.carousel-peek').forEach((card) => {
        card.onclick = (event) => {
          if (event.target.closest('.js-peek-details') || event.target.closest('a')) return;
          const projectId = Number(card.dataset.id);
          if (!Number.isFinite(projectId)) return;
          state.activeProjectId = projectId;
          renderSpotlight();
          renderCarouselCards();
        };

        card.onkeydown = (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          const projectId = Number(card.dataset.id);
          if (!Number.isFinite(projectId)) return;
          state.activeProjectId = projectId;
          renderSpotlight();
          renderCarouselCards();
        };
      });

      document.querySelectorAll('.js-peek-details').forEach((button) => {
        button.onclick = () => {
          const projectId = Number(button.dataset.id);
          if (!Number.isFinite(projectId)) return;
          openProjectModal(projectId);
        };
      });
    }

    function shiftProject(step) {
      const currentIndex = getProjectIndex(state.activeProjectId);
      const nextIndex = wrapProjectIndex(currentIndex + step);
      state.activeProjectId = projects[nextIndex].id;
      renderSpotlight();
      renderCarouselCards();
    }

    function setupCarouselControls() {
      const prevButton = document.getElementById('carousel-prev');
      const nextButton = document.getElementById('carousel-next');
      const prevFooterButton = document.getElementById('carousel-prev-btn');
      const detailsFooterButton = document.getElementById('carousel-details-btn');
      const nextFooterButton = document.getElementById('carousel-next-btn');

      if (prevButton) prevButton.onclick = () => shiftProject(-1);
      if (nextButton) nextButton.onclick = () => shiftProject(1);
      if (prevFooterButton) prevFooterButton.onclick = () => shiftProject(-1);
      if (detailsFooterButton) detailsFooterButton.onclick = () => openProjectModal(state.activeProjectId);
      if (nextFooterButton) nextFooterButton.onclick = () => shiftProject(1);

      document.addEventListener('keydown', (event) => {
        const modalOpen = document.getElementById('project-modal-overlay')?.classList.contains('open');
        if (modalOpen) return;
        if (event.key === 'ArrowLeft') shiftProject(-1);
        if (event.key === 'ArrowRight') shiftProject(1);
      });
    }

    function renderSpotlight() {
      const project = getProject(state.activeProjectId);
      if (!project) return;

      const image = document.getElementById('spotlight-image');
      image.src = project.image;
      image.alt = `${project.title} preview`;

      document.getElementById('spotlight-system').textContent = `${project.systemLabel} • Project ${project.id}`;
      document.getElementById('spotlight-status').textContent = `${project.year} • ${project.status}`;
      document.getElementById('spotlight-title').textContent = project.title;
      document.getElementById('spotlight-summary').textContent = project.summary;
      document.getElementById('spotlight-architecture').textContent = project.architecture;
      document.getElementById('spotlight-impact').textContent = project.impact;
      document.getElementById('spotlight-stack').textContent = project.stack;
      const externalLink = document.getElementById('spotlight-external');
      if (externalLink) {
        if (project.demoUrl) {
          externalLink.href = project.demoUrl;
          externalLink.hidden = false;
          externalLink.setAttribute('aria-label', `Open ${project.title}`);
        } else {
          externalLink.removeAttribute('href');
          externalLink.hidden = true;
        }
      }

      document.getElementById('spotlight-tags').innerHTML = project.tags
        .map((tag) => `<span class="tag">${tag}</span>`)
        .join('');
    }

    function openProjectModal(projectId) {
      const overlay = document.getElementById('project-modal-overlay');
      const project = getProject(projectId);
      if (!overlay || !project) return;

      state.activeProjectId = project.id;
      renderSpotlight();
      renderCarouselCards();

      lastFocused = document.activeElement;

      document.getElementById('modal-kicker').textContent = 'Project Detail';
      document.getElementById('modal-image').src = project.image;
      document.getElementById('modal-image').alt = `${project.title} preview`;
      document.getElementById('modal-id-year').textContent = `Project ${project.id} • ${project.year}`;
      document.getElementById('modal-system-status').textContent = `${project.systemLabel} • ${project.status}`;
      document.getElementById('modal-title').textContent = project.title;
      document.getElementById('modal-summary').textContent = project.summary;
      document.getElementById('modal-architecture').textContent = project.architecture;
      document.getElementById('modal-impact').textContent = project.impact;
      document.getElementById('modal-stack').textContent = project.stack;
      document.getElementById('modal-proof').textContent = project.proof;

      document.getElementById('modal-tags').innerHTML = project.tags
        .map((tag) => `<span class="tag">${tag}</span>`)
        .join('');

      document.getElementById('modal-actions').innerHTML = `
        ${createMainAction('Visit Project', project.demoUrl, 'primary', 'No Public Link')}
        ${createMainAction('View Code', project.codeUrl, 'secondary', 'Code Not Public')}
        <button class="btn btn-secondary" id="modal-focus-spotlight" type="button">Focus In Spotlight</button>
      `;

      const focusButton = document.getElementById('modal-focus-spotlight');
      if (focusButton) {
        focusButton.addEventListener('click', () => {
          state.activeProjectId = project.id;
          renderSpotlight();
          renderCarouselCards();
          closeProjectModal();
          focusSpotlight();
        });
      }

      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';

      const closeButton = document.getElementById('modal-close');
      if (closeButton) closeButton.focus();
    }

    function closeProjectModal() {
      const overlay = document.getElementById('project-modal-overlay');
      if (!overlay) return;

      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      if (lastFocused && document.contains(lastFocused) && typeof lastFocused.focus === 'function') {
        lastFocused.focus();
      }
    }

    function setupProjectModal() {
      const overlay = document.getElementById('project-modal-overlay');
      const closeButton = document.getElementById('modal-close');
      if (!overlay || !closeButton) return;

      closeButton.addEventListener('click', closeProjectModal);

      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) {
          closeProjectModal();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && overlay.classList.contains('open')) {
          closeProjectModal();
        }
      });
    }

    function focusSpotlight() {
      const section = document.getElementById('spotlight');
      if (!section) return;

      const rect = section.getBoundingClientRect();
      if (rect.top < -80 || rect.top > window.innerHeight * 0.45) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function setupReveal() {
      const targets = Array.from(document.querySelectorAll('.reveal')).filter((item) => !item.classList.contains('on'));
      if (!targets.length) return;

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('on');
            observer.unobserve(entry.target);
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
      );

      targets.forEach((target) => observer.observe(target));
    }

    function setLastUpdated() {
      const updated = document.getElementById('last-updated');
      if (!updated) return;

      updated.textContent = new Date().toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function syncTopbarHeight() {
      const topbarWrap = document.querySelector('.topbar-wrap');
      if (!topbarWrap) return;
      const height = Math.ceil(topbarWrap.getBoundingClientRect().height);
      document.documentElement.style.setProperty('--topbar-height', `${height}px`);
    }

    function setupTopbarHeightSync() {
      const topbarWrap = document.querySelector('.topbar-wrap');
      if (!topbarWrap) return;

      syncTopbarHeight();

      if (topbarResizeObserver) {
        topbarResizeObserver.disconnect();
      }

      if ('ResizeObserver' in window) {
        topbarResizeObserver = new ResizeObserver(() => syncTopbarHeight());
        topbarResizeObserver.observe(topbarWrap);
      }

      if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
        document.fonts.ready.then(syncTopbarHeight);
      }
    }

    setupTopbarHeightSync();
    renderSpotlight();
    renderCarouselCards();
    setupCarouselControls();
    setupProjectModal();
    setupReveal();
    setLastUpdated();
    window.addEventListener('load', syncTopbarHeight);

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        syncTopbarHeight();
        renderCarouselCards();
      }, 180);
    });
  </script>
</body>
</html>
