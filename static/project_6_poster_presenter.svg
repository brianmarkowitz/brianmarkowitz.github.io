  <text x="260" y="350" fill="#9fe7da" font-family="IBM Plex Sans, sans-serif" font-size="30">rekognition + speech + llm orchestration</text>
  <text x="890" y="328" fill="#d8d3ff" font-family="IBM Plex Mono, monospace" font-size="28">facial cue detection</text>
