<g fill="#d3e3da" font-family="monospace" font-size="11" letter-spacing="1.5"><text x="490" y="149">INTERFACE</text><text x="490" y="250">LOGIC</text><text x="490" y="343">DATA</text></g>
<g fill="#192425" stroke="#d5f39d"><circle cx="404" cy="128" r="3"/><circle cx="398" cy="227" r="3"/><circle cx="396" cy="318" r="3"/></g>
<path class="signal" d="M279 414v-47l184-102V128l-58 32-35-18" pathLength="310" stroke="#defdb0" stroke-width="2" stroke-linecap="round" stroke-dasharray="33 277" opacity="0" aria-hidden="true"/>
<g aria-hidden="true">
  <path d="M492 160h52M492 261h52M492 354h52" stroke="#637d7f" stroke-width=".6" opacity=".50"/>
  <g transform="translate(492 160)"><rect class="ambient-glint ambient-ui" width="9" height="1.8" x="0" y="-.9" rx=".9" fill="#d7f5a7" opacity="0"/></g>
  <g transform="translate(492 261)"><rect class="ambient-glint ambient-logic" width="9" height="1.8" x="0" y="-.9" rx=".9" fill="#bfe9cb" opacity="0"/></g>
