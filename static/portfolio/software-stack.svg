<svg id="portfolio-board" xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" fill="none" role="img" aria-labelledby="portfolio-board-t portfolio-board-d">
<title id="portfolio-board-t">An exploded diagram of a software system</title><desc id="portfolio-board-d">Three isometric plates depict the interface, application logic and data layers. Fine registration lines show how the pieces align.</desc>
<style>
@media (prefers-reduced-motion: no-preference) {
  .plate-layer { animation: settle 640ms cubic-bezier(.22,.78,.26,1) backwards; }
  .logic-layer { animation-delay: 70ms; }
  .interface-layer { animation-delay: 150ms; }
  .signal { animation: send-signal 780ms 430ms cubic-bezier(.25,.55,.36,1) backwards; }
  @keyframes settle {
    from { transform: translateY(var(--lift)); opacity: .47; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes send-signal {
    0% { opacity: 0; stroke-dashoffset: 310; }
    14% { opacity: 1; }
    76% { opacity: .87; }
    100% { opacity: 0; stroke-dashoffset: 0; }
  }
}
</style>
<defs>
 <pattern id="portfolio-board-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r=".75" fill="#648087" opacity=".43"/></pattern>
 <linearGradient id="portfolio-board-base" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#283b46"/><stop offset="1" stop-color="#172329"/></linearGradient>
 <linearGradient id="portfolio-board-logic" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#819399"/><stop offset=".6" stop-color="#435a63"/><stop offset="1" stop-color="#35464d"/></linearGradient>
 <linearGradient id="portfolio-board-top" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#e8f5af"/><stop offset=".38" stop-color="#d4ff7a"/><stop offset="1" stop-color="#9ec946"/></linearGradient>
 <pattern id="portfolio-board-trace" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M-6 12H5l5-5h14M14 24v-6l4-4h6" stroke="#7eaab1" stroke-width="1" opacity=".7"/><circle cx="5" cy="12" r="1.35" fill="#b2cbd0"/></pattern>
 <pattern id="portfolio-board-mesh" width="13" height="13" patternUnits="userSpaceOnUse"><path d="M0 0H13V13" stroke="#3d581e" stroke-width=".8" opacity=".48"/></pattern>
 <path id="portfolio-board-plate" d="m307 0 156 85-184 103-156-85z"/>
</defs>
<rect x="8" y="10" width="620" height="472" fill="url(#portfolio-board-dots)"/>
<g stroke="#53676c" stroke-width=".8" stroke-dasharray="3 5" opacity=".78"><path d="M123 145v202M307 42v202M463 127v202M279 230v202"/><path d="M87 318l218-124 201 109-223 126z"/><path d="m83 331 204 111 228-128"/></g>
<g stroke-linejoin="round">
