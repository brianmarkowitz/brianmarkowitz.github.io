 </g><g class="plate-layer logic-layer" style="--lift:21px"><g transform="translate(0 139)"><path d="M123 103v10l156 85v-10z" fill="#465a63" stroke="#8ea0a4"/><path d="M279 188v10l184-103V85z" fill="#2d4049" stroke="#a1afb0"/><use href="#portfolio-board-plate" fill="url(#portfolio-board-logic)" stroke="#cdd6d2" stroke-width="1.4"/><g transform="matrix(.91 -.51 .83 .45 145 102)" fill="none" stroke="#dbe8e6"><rect width="176" height="147" rx="3" stroke-opacity=".36"/><path d="M8 25h33v22h39m-72 62h36V85h37m50-39h24V21h13m-36 68h21v34h16M13 69h39m102 0h13"/><g fill="#aee16c" stroke="#e4f6c1"><rect x="66" y="42" width="65" height="59" rx="3" fill="#263b43"/><rect x="74" y="50" width="49" height="43" rx="2" stroke-opacity=".56"/><path d="M83 64h11v-7l13 15-13 14v-9H83z" fill="#263b43" stroke="none"/></g><g fill="#d1dfd9"><circle cx="8" cy="25" r="2"/><circle cx="8" cy="109" r="2"/><circle cx="168" cy="21" r="2"/><circle cx="170" cy="123" r="2"/></g></g></g>
 </g><g class="plate-layer interface-layer" style="--lift:29px"><g transform="translate(0 43)"><path d="M123 103v9l156 85v-9z" fill="#91ba45" stroke="#d4ee98"/><path d="M279 188v9L463 94v-9z" fill="#759739" stroke="#d4ee98"/><use href="#portfolio-board-plate" fill="url(#portfolio-board-top)" stroke="#e1ffae" stroke-width="1.8"/>
 <g transform="matrix(.91 -.51 .83 .45 145 102)"><rect width="176" height="147" rx="3" fill="url(#portfolio-board-mesh)" stroke="#577330"/>
