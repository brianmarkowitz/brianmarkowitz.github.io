 <path d="M31 104h47m-47-8h38m-38-8h48" stroke="#657d41" stroke-width="2.5"/><path d="M85 65h61v36H85z" fill="#a9cc70"/><path d="m90 93 12-11 8 4 9-12 6 4 13-10" stroke="#364d2b" stroke-width="2.8"/><rect x="31" y="52" width="57" height="8" rx="1" fill="#3b522c"/></g></g>
</g></g>
